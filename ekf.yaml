ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    
    # Konfigurasi Nama Frame
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # ===============================================
    # SENSOR 1: ODOMETRI RODA ZLAC (dari odom_node.py)
    # ===============================================
    odom0: /odom
    # Matriks Konfigurasi: [X, Y, Z, Roll, Pitch, Yaw, Vx, Vy, Vz, Vroll, Vpitch, Vyaw, Ax, Ay, Az]
    # Kita menyuruh EKF untuk PERCAYA pada pergerakan translasi (X, Y) dan kecepatan roda
    odom0_config: [true,  true,  false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10

    # ===============================================
    # SENSOR 2: IMU BNO08x (dari Teensy)
    # ===============================================
    imu0: /imu/data_fixed
    # Matriks Konfigurasi: [X, Y, Z, Roll, Pitch, Yaw, Vx, Vy, Vz, Vroll, Vpitch, Vyaw, Ax, Ay, Az]
    # Kita menyuruh EKF untuk PERCAYA PENUH pada orientasi sudut (Yaw) dan kecepatan beloknya
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 10